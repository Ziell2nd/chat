<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruang Bicara</title>
<style>
  :root{
    --paper: #f2ede4;
    --ink: #2f2a24;
    --sage: #7c8f6f;
    --sage-deep: #566349;
    --clay: #c98a5e;
    --line: #ded4c2;
    --bubble-me: #7c8f6f;
    --bubble-them: #ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: 'Iowan Old Style','Palatino Linotype',Georgia,serif;
    background: var(--paper);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header{
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
    text-align:center;
  }
  header .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--sage-deep);
    margin-bottom: 6px;
  }
  header h1{
    margin:0;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.01em;
  }
  header .sub{
    margin-top:4px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12.5px;
    color: #8a8074;
  }

  #room-banner{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    text-align:center;
    padding: 8px 16px;
    background: #fff8ec;
    border-bottom: 1px solid var(--line);
    color: var(--sage-deep);
    display:none;
  }
  #room-banner a{color: var(--clay); font-weight:600; word-break:break-all;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width: 640px;
    width:100%;
    margin: 0 auto;
    padding: 20px 16px 12px;
    overflow: hidden;
    position: relative;
  }

  #status{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11.5px;
    color: #a99e8c;
    text-align:center;
    margin-bottom: 10px;
    min-height: 14px;
  }

  #messages{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap: 10px;
    padding: 4px 4px 16px;
  }

  .empty-state{
    margin:auto;
    text-align:center;
    color:#a99e8c;
    font-size: 14px;
    max-width: 280px;
    line-height:1.6;
  }

  /* message wrapper: sized to content, capped, no ambiguous flex-basis nesting */
  .msg{
    display:flex;
    flex-direction:column;
    max-width: 80%;
  }
  .msg.me{ align-self:flex-end; align-items:flex-end; }
  .msg.them{ align-self:flex-start; align-items:flex-start; }

  .bubble{
    display:inline-block;
    max-width:100%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 15px;
    box-shadow: 0 1px 2px rgba(47,42,36,0.06);
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .msg.me .bubble{
    background: var(--bubble-me);
    color: #fbfaf6;
    border-bottom-right-radius: 4px;
  }
  .msg.them .bubble{
    background: var(--bubble-them);
    border: 1px solid var(--line);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .bubble.sticker{
    background: transparent !important;
    border: none !important;
    box-shadow: none;
    font-size: 46px;
    padding: 0;
    line-height:1.1;
  }
  .bubble.sticker-img{
    background: transparent !important;
    border: none !important;
    box-shadow: none;
    padding: 0;
  }
  .bubble.sticker-img img{
    max-width: 160px;
    max-height: 160px;
    border-radius: 14px;
    display:block;
  }
  .meta{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10.5px;
    color: #a99e8c;
    margin-top: 3px;
    padding: 0 4px;
  }
  .name{ font-weight:600; color: var(--sage-deep); }
  .msg.me .name{ color: #b57849; }

  form{
    display:flex;
    align-items:flex-end;
    gap: 8px;
    padding: 12px 4px 4px;
    border-top: 1px solid var(--line);
    position:relative;
  }
  textarea{
    flex:1;
    resize:none;
    border: 1px solid var(--line);
    background:#fff;
    border-radius: 14px;
    padding: 11px 14px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14.5px;
    line-height:1.4;
    color: var(--ink);
    max-height: 120px;
  }
  textarea:focus{ outline: 2px solid var(--sage); outline-offset: 1px; }
  button{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--sage);
    color: #fbfaf6;
    border:none;
    border-radius: 14px;
    padding: 0 20px;
    height: 42px;
    font-size: 14px;
    font-weight:600;
    cursor:pointer;
    transition: background 0.15s ease;
    flex-shrink:0;
  }
  button:hover{ background: var(--sage-deep); }
  button:disabled{ background:#c8c3b6; cursor:default; }

  #emoji-toggle, #sticker-toggle{
    background: #fff;
    border: 1px solid var(--line);
    color: var(--sage-deep);
    width: 42px;
    height: 42px;
    padding:0;
    font-size: 19px;
    border-radius: 14px;
    flex-shrink:0;
  }
  #emoji-toggle:hover, #sticker-toggle:hover{ background: #fff8ec; }

  #emoji-panel, #sticker-panel{
    display:none;
    position:absolute;
    bottom: 60px;
    left: 4px;
    right: 4px;
    max-height: 220px;
    overflow-y:auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(47,42,36,0.15);
    padding: 10px;
    z-index: 15;
  }
  #emoji-panel.open, #sticker-panel.open{ display:grid; }
  #emoji-panel{
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  #emoji-panel button{
    all:unset;
    cursor:pointer;
    font-size: 21px;
    text-align:center;
    padding: 6px 0;
    border-radius: 8px;
    height:auto;
  }
  #emoji-panel button:hover{ background: #f2ede4; }
  #sticker-panel{
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  #sticker-panel button{
    all:unset;
    cursor:pointer;
    font-size: 30px;
    text-align:center;
    padding: 10px 0;
    border-radius: 10px;
    height:auto;
  }
  #sticker-panel button:hover{ background: #f2ede4; }
  #sticker-panel .upload-tile{
    font-size: 20px !important;
    color: var(--sage-deep);
    border: 1px dashed var(--line) !important;
  }
  #sticker-panel .custom-thumb{
    padding: 4px !important;
  }
  #sticker-panel .custom-thumb img{
    width: 100%;
    height: 48px;
    object-fit: cover;
    border-radius: 8px;
    display:block;
  }
  #sticker-panel .section-label{
    grid-column: 1 / -1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #a99e8c;
    padding: 4px 2px 0;
  }

  /* name overlay */
  #name-overlay{
    position:fixed; inset:0;
    background: rgba(47,42,36,0.55);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    z-index: 20;
  }
  #name-card{
    background: var(--paper);
    border-radius: 18px;
    padding: 28px 26px;
    max-width: 340px;
    width:100%;
    text-align:center;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
  }
  #name-card .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 10.5px;
    color: var(--sage-deep);
    margin-bottom: 8px;
  }
  #name-card h2{ margin: 0 0 6px; font-weight:500; font-size:19px; }
  #name-card p{ margin: 0 0 18px; font-size: 13px; color:#8a8074; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height:1.5;}
  #name-input{
    width:100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    margin-bottom: 12px;
  }
  #name-input:focus{ outline: 2px solid var(--sage); outline-offset:1px; }
  #name-card button{ width:100%; padding: 11px 0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<div id="name-overlay">
  <div id="name-card">
    <div class="eyebrow">Sebelum masuk</div>
    <h2>Siapa namamu?</h2>
    <p>Nama ini dipakai supaya pesan kalian berdua bisa dibedakan. Diminta lagi tiap buka halaman ini.</p>
    <input id="name-input" type="text" placeholder="Nama kamu" maxlength="24" autocomplete="off">
    <button id="name-submit">Masuk ke ruang bicara</button>
  </div>
</div>

<header>
  <div class="eyebrow">Ruang Bicara</div>
  <h1>Ngobrol yuk</h1>
  <div class="sub">Pesan tersimpan bersama, jika reload mohon isi nama yang sama</div>
</header>

<div id="room-banner"></div>

<main>
  <div id="status">Menyiapkan ruang…</div>
  <div id="messages"><div class="empty-state">Belum ada pesan. Mulai dari kamu ya.</div></div>

  <form id="send-form">
    <button type="button" id="emoji-toggle" title="Emoji">🙂</button>
    <button type="button" id="sticker-toggle" title="Stiker">✨</button>
    <textarea id="msg-input" rows="1" placeholder="Tulis sesuatu…" maxlength="2000"></textarea>
    <button type="submit" id="send-btn">Kirim</button>

    <div id="emoji-panel"></div>
    <div id="sticker-panel"></div>
    <input type="file" id="sticker-file" accept="image/*" style="display:none">
  </form>
</main>

<script>
(function(){
  const API_BASE = "https://jsonblob.com/api/jsonBlob";
  const POLL_MS = 4000;

  const EMOJIS = ["😀","😄","😊","😍","🥰","😘","😉","😜","🤪","🤔",
                  "😅","😂","🥲","😭","😢","😤","😡","🥺","😴","🤗",
                  "😎","🙄","😬","🤝","👍","👎","🙏","👏","💪","✌️",
                  "❤️","🧡","💛","💚","💙","💜","🖤","🤍","💔","💯",
                  "🔥","✨","🎉","🎮","☕","🌿","🌙","⭐","🌸","☀️"];

  const STICKERS = ["🕊️ damai","🌿 santai","☕ istirahat dulu","🤝 kita bicarain",
                     "💚 aku dengerin","🙏 makasih ya","😌 pelan-pelan","🎮 main bareng?"];

  const params = new URLSearchParams(location.search);
  let roomId = params.get('room');
  let myName = "";
  let lastCount = 0;
  let polling = null;

  const statusEl = document.getElementById('status');
  const messagesEl = document.getElementById('messages');
  const bannerEl = document.getElementById('room-banner');
  const form = document.getElementById('send-form');
  const input = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const overlay = document.getElementById('name-overlay');
  const nameInput = document.getElementById('name-input');
  const nameSubmit = document.getElementById('name-submit');
  const emojiToggle = document.getElementById('emoji-toggle');
  const stickerToggle = document.getElementById('sticker-toggle');
  const emojiPanel = document.getElementById('emoji-panel');
  const stickerPanel = document.getElementById('sticker-panel');
  const stickerFileInput = document.getElementById('sticker-file');

  let customStickers = [];
  try{
    const saved = localStorage.getItem('ruangbicara-custom-stickers');
    if(saved) customStickers = JSON.parse(saved);
  }catch(e){ /* localStorage tidak tersedia, lanjut tanpa persist */ }

  EMOJIS.forEach(function(e){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = e;
    b.addEventListener('click', function(){ insertAtCursor(e); });
    emojiPanel.appendChild(b);
  });

  function renderStickerPanel(){
    stickerPanel.innerHTML = '';

    const uploadBtn = document.createElement('button');
    uploadBtn.type = 'button';
    uploadBtn.className = 'upload-tile';
    uploadBtn.innerHTML = '📤<br><span style="font-size:10px">Upload</span>';
    uploadBtn.addEventListener('click', function(){ stickerFileInput.click(); });
    stickerPanel.appendChild(uploadBtn);

    STICKERS.forEach(function(s){
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.split(' ')[0];
      b.title = s;
      b.addEventListener('click', function(){ sendSticker(s, 'sticker'); closePanels(); });
      stickerPanel.appendChild(b);
    });

    if(customStickers.length){
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Stiker kamu';
      stickerPanel.appendChild(label);

      customStickers.forEach(function(dataUrl){
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'custom-thumb';
        b.innerHTML = '<img src="' + dataUrl + '" alt="stiker">';
        b.addEventListener('click', function(){ sendSticker(dataUrl, 'image'); closePanels(); });
        stickerPanel.appendChild(b);
      });
    }
  }
  renderStickerPanel();

  function resizeImageFile(file, maxDim){
    return new Promise(function(resolve, reject){
      const reader = new FileReader();
      reader.onerror = function(){ reject(new Error('gagal membaca file')); };
      reader.onload = function(){
        const img = new Image();
        img.onerror = function(){ reject(new Error('gagal memuat gambar')); };
        img.onload = function(){
          let w = img.width, h = img.height;
          if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
          else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/png'));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  stickerFileInput.addEventListener('change', async function(){
    const file = stickerFileInput.files[0];
    stickerFileInput.value = '';
    if(!file) return;
    if(!file.type.startsWith('image/')){
      setStatus('File harus berupa gambar.');
      return;
    }
    try{
      setStatus('Menyiapkan stiker…');
      const dataUrl = await resizeImageFile(file, 220);
      if(dataUrl.length > 300000){
        setStatus('Gambar masih terlalu besar, coba gambar lain.');
        return;
      }
      customStickers.unshift(dataUrl);
      customStickers = customStickers.slice(0, 12);
      try{ localStorage.setItem('ruangbicara-custom-stickers', JSON.stringify(customStickers)); }catch(e){}
      renderStickerPanel();
      await sendSticker(dataUrl, 'image');
      closePanels();
      setStatus('Tersambung');
    }catch(err){
      setStatus('Gagal memproses gambar, coba lagi.');
    }
  });

  function closePanels(){
    emojiPanel.classList.remove('open');
    stickerPanel.classList.remove('open');
  }
  emojiToggle.addEventListener('click', function(){
    const willOpen = !emojiPanel.classList.contains('open');
    closePanels();
    if(willOpen) emojiPanel.classList.add('open');
  });
  stickerToggle.addEventListener('click', function(){
    const willOpen = !stickerPanel.classList.contains('open');
    closePanels();
    if(willOpen) stickerPanel.classList.add('open');
  });
  document.addEventListener('click', function(e){
    if(!form.contains(e.target)) closePanels();
  });

  function insertAtCursor(text){
    const start = input.selectionStart || input.value.length;
    const end = input.selectionEnd || input.value.length;
    input.value = input.value.slice(0,start) + text + input.value.slice(end);
    const pos = start + text.length;
    input.focus();
    input.setSelectionRange(pos,pos);
  }

  function setStatus(text){ statusEl.textContent = text; }

  function showRoomLink(){
    const link = location.origin + location.pathname + '?room=' + roomId;
    bannerEl.innerHTML = 'Ruang ini siap. Kirim link ini ke satu orang lagi: <br><a href="' + link + '">' + link + '</a>';
    bannerEl.style.display = 'block';
  }

  async function createRoom(){
    setStatus('Membuat ruang baru…');
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: []})
    });
    if(!res.ok) throw new Error('gagal membuat ruang');
    const location_header = res.headers.get('Location');
    const id = location_header ? location_header.split('/').pop() : null;
    if(!id) throw new Error('tidak dapat id ruang');
    roomId = id;
    const url = new URL(window.location);
    url.searchParams.set('room', roomId);
    history.replaceState(null, '', url);
    showRoomLink();
  }

  async function fetchMessages(){
    const res = await fetch(API_BASE + '/' + roomId);
    if(!res.ok) throw new Error('gagal ambil pesan');
    const data = await res.json();
    return data.messages || [];
  }

  async function pushMessages(msgs){
    const res = await fetch(API_BASE + '/' + roomId, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: msgs})
    });
    if(!res.ok) throw new Error('gagal kirim pesan');
  }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  }

  function render(msgs){
    if(msgs.length === 0){
      messagesEl.innerHTML = '<div class="empty-state">Belum ada pesan. Mulai dari kamu ya.</div>';
      return;
    }
    messagesEl.innerHTML = msgs.map(m => {
      const mine = m.sender === myName;
      const side = mine ? 'me' : 'them';
      const safeName = escapeHtml(m.sender);
      const isSticker = m.type === 'sticker';
      const isImage = m.type === 'image';
      const bubbleClass = 'bubble' + (isSticker ? ' sticker' : '') + (isImage ? ' sticker-img' : '');
      const bubbleInner = isImage
        ? '<img src="' + m.text + '" alt="stiker">'
        : escapeHtml(m.text);
      return '<div class="msg ' + side + '">' +
          '<div class="' + bubbleClass + '">' + bubbleInner + '</div>' +
          '<div class="meta">' + (mine ? '' : '<span class="name">' + safeName + '</span> · ') + fmtTime(m.ts) + '</div>' +
      '</div>';
    }).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  async function poll(){
    try{
      const msgs = await fetchMessages();
      if(msgs.length !== lastCount){
        lastCount = msgs.length;
        render(msgs);
      }
      setStatus('Tersambung');
    }catch(e){
      setStatus('Tidak bisa memuat pesan, coba lagi…');
    }
  }

  async function init(){
    try{
      if(!roomId){
        await createRoom();
      } else {
        showRoomLink();
      }
      await poll();
      polling = setInterval(poll, POLL_MS);
    }catch(e){
      setStatus('Gagal menyiapkan ruang. Muat ulang halaman.');
    }
  }

  async function sendMessage(text, type){
    if(!text || !roomId) return;
    sendBtn.disabled = true;
    try{
      const msgs = await fetchMessages();
      msgs.push({sender: myName, text: text, ts: Date.now(), type: type || 'text'});
      await pushMessages(msgs);
      lastCount = msgs.length;
      render(msgs);
    }catch(err){
      setStatus('Pesan gagal terkirim, coba lagi.');
    }finally{
      sendBtn.disabled = false;
    }
  }

  function sendSticker(s, type){
    return sendMessage(s, type || 'sticker');
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;
    closePanels();
    await sendMessage(text, 'text');
    input.value = '';
    input.style.height = 'auto';
    input.focus();
  });

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      form.requestSubmit();
    }
  });
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  nameSubmit.addEventListener('click', function(){
    const val = nameInput.value.trim();
    if(!val) { nameInput.focus(); return; }
    myName = val;
    overlay.style.display = 'none';
    init();
  });
  nameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ nameSubmit.click(); }
  });
  nameInput.focus();
})();
</script>

</body>
</html>
